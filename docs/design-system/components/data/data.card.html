<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.wrap{padding:20px;display:flex;flex-direction:column;gap:16px}.row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px}.lbl{font:var(--type-caption);color:var(--text-subtle);text-transform:uppercase;letter-spacing:var(--tracking-wide)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { DataTable, StatusPill, Button } = window.BOMYDesignSystem_030168;
function Demo(){
const [sel,setSel]=React.useState(['p2']);
const rows=[
{id:'p1',name:'Kopi O Kaw Drip Bags',slug:'kopi-o-kaw-drip-bags',status:'active',price:'RM24.90'},
{id:'p2',name:'Kopi Cham Blend 500g',slug:'kopi-cham-blend-500g',status:'active',price:'RM52.00'},
{id:'p3',name:'White Coffee Sachets',slug:'white-coffee-sachets',status:'draft',price:'RM18.00'},
{id:'p4',name:"Roaster's Gift Tin",slug:'roasters-gift-tin',status:'archived',price:'RM88.00'}];
return(<div className="wrap"><DataTable selectable selected={sel} onSelectionChange={setSel} rows={rows} columns={[
{key:'name',header:'Product'},
{key:'slug',header:'Slug',render:r=><span style={{font:'var(--type-mono)',color:'var(--text-muted)'}}>{r.slug}</span>},
{key:'status',header:'Status',render:r=><StatusPill status={r.status}/>},
{key:'price',header:'Price',align:'right'},
{key:'a',header:'',align:'right',render:()=><Button variant="link" style={{fontSize:'var(--text-xs)'}}>Edit</Button>}]}/></div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
