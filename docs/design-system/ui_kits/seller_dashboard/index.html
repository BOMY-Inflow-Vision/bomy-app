<!doctype html><html lang="en"><head><meta charset="utf-8"><title>BOMY — Seller dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-sunken)}#root{min-height:100vh}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="OverviewScreen.jsx.txt"></script>
<script type="text/babel" src="SellerProductsScreen.jsx.txt"></script>
<script type="text/babel" src="OrdersScreen.jsx.txt"></script>
<script type="text/babel">
const { SellerSidebar } = window.BOMYDesignSystem_030168

function App() {
  const [route, setRoute] = React.useState("/seller/dashboard")
  const go = (r) => setRoute(r)
  let screen = <OverviewScreen go={go} />
  if (route.endsWith("/products")) screen = <SellerProductsScreen />
  else if (route.endsWith("/orders")) screen = <SellerOrdersScreen />
  else if (route.endsWith("/subscriptions") || route.endsWith("/settings")) {
    screen = (
      <div style={{ padding: "var(--space-8)" }}>
        <p style={{ font: "var(--type-body)", color: "var(--text-muted)" }}>
          Not recreated in this kit — the source screen exists in bomy-app but is out of scope for the first redesign pass.
        </p>
      </div>
    )
  }
  return (
    <div style={{ display: "flex", minHeight: "100vh" }}>
      <SellerSidebar storeName="Ah Huat Roasters" activeHref={route} iconBase="../../assets/icons" onNavigate={go} />
      <main style={{ flex: 1, background: "var(--surface-sunken)" }}>{screen}</main>
    </div>
  )
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />)
</script></body></html>
