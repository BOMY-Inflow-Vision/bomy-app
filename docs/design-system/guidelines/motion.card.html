<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font:var(--type-body);color:var(--text-body)}.wrap{padding:20px}</style></head><body><div class="wrap" style="display:flex;gap:14px;align-items:center">
<div style="padding:10px 16px;border-radius:var(--radius-control);background:var(--action-primary);color:#fff;font:var(--type-label);font-weight:600;transition:var(--transition-color)">Hover: −1 step</div>

</div></body></html>
